name: Deploy Backend API to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Deploy backend & restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "🚀 Deploying Backend API..."

            cd ~/Healthcareserver

            echo "🔐 Marking repo as safe for Git..."
            git config --global --add safe.directory /home/ubuntu/Healthcareserver

            echo "📥 Pulling latest code..."
            git pull origin master

            echo "📦 Installing dependencies..."
            npm install --production

            echo "♻️ Restarting PM2 process..."
            pm2 describe wellness > /dev/null \
            && pm2 restart wellness \
            || pm2 start server.js --name wellness

            echo "💾 Saving PM2 process list..."
            pm2 save

            echo "🌐 Restarting Nginx..."
            sudo systemctl restart nginx
            echo "✅ Deployment completed successfully!"